# docker-compose.prod.yml
#
# Todos os serviços usam network_mode: host porque os bots efêmeros são lançados
# com network_mode: host (via Docker socket), então precisam alcançar postgres/redis
# via localhost. A rede bridge impediria a resolução dos service names nesses containers.
#
# Segurança: postgres e redis ficam vinculados em 127.0.0.1 — não expostos externamente.
# MinIO fica em 0.0.0.0 para que URLs pré-assinadas de gravações sejam acessíveis.
# Configure o firewall para bloquear acesso externo às portas 5432, 6379 se necessário.

services:
  attendee-app:
    image: ${ATTENDEE_RELEASE_IMAGE:?Set ATTENDEE_RELEASE_IMAGE to an immutable Attendee image tag}
    restart: always
    network_mode: host
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: attendee.settings.production
    volumes:
      - /home/deploy/apps/attendee/staticfiles:/attendee/staticfiles
    command: >
      gunicorn attendee.wsgi:application
        --bind 127.0.0.1:8000 --workers 4 --timeout 120
    depends_on: [postgres, redis]

  attendee-worker:
    image: ${ATTENDEE_RELEASE_IMAGE:?Set ATTENDEE_RELEASE_IMAGE to an immutable Attendee image tag}
    restart: always
    network_mode: host
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: attendee.settings.production
      ENABLE_CHROME_SANDBOX: "false"
      LAUNCH_BOT_METHOD: docker-compose-multi-host
      BOT_MEMORY_LIMIT: "2g"
      BOT_CPU_QUOTA: "100000" # 1 vCPU por bot
      BOT_MAX_SIMULTANEOUS_BOTS: "8"
      BOT_CONTAINER_IMAGE: ${ATTENDEE_RELEASE_IMAGE:?Set ATTENDEE_RELEASE_IMAGE to an immutable Attendee image tag}
      BOT_HOST_CODE_PATH: ${ATTENDEE_HOST_CODE_PATH:?Set ATTENDEE_HOST_CODE_PATH to the matching release checkout}
      BOT_CONTAINER_AUTO_REMOVE: "true"
      DELIVER_WEBHOOK_CELERY_QUEUE: "webhooks"
      BOT_RECORDING_SPOOL_DIRECTORY: "/attendee-recording-spool"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ATTENDEE_RECORDING_SPOOL_HOST_PATH:-/var/lib/attendee/recordings}:/attendee-recording-spool
    group_add:
      - "${DOCKER_GID:-989}"
    command: celery -A attendee worker -n worker@%h -l INFO -Q celery -I bots.tasks.joining_watchdog_task
    depends_on: [postgres, redis]

  attendee-launcher-worker:
    image: ${ATTENDEE_RELEASE_IMAGE:?Set ATTENDEE_RELEASE_IMAGE to an immutable Attendee image tag}
    restart: always
    network_mode: host
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: attendee.settings.production
      HOME: /home/app
      ENABLE_CHROME_SANDBOX: "false"
      LAUNCH_BOT_METHOD: docker-compose-multi-host
      BOT_MEMORY_LIMIT: "2g"
      BOT_CPU_QUOTA: "100000"
      BOT_MAX_SIMULTANEOUS_BOTS: "8"
      BOT_CONTAINER_IMAGE: ${ATTENDEE_RELEASE_IMAGE:?Set ATTENDEE_RELEASE_IMAGE to an immutable Attendee image tag}
      BOT_HOST_CODE_PATH: ${ATTENDEE_HOST_CODE_PATH:?Set ATTENDEE_HOST_CODE_PATH to the matching release checkout}
      BOT_CONTAINER_AUTO_REMOVE: "true"
      DELIVER_WEBHOOK_CELERY_QUEUE: "webhooks"
      BOT_RECORDING_SPOOL_DIRECTORY: "/attendee-recording-spool"
      ATTENDEE_RECORDING_SPOOL_HOST_PATH: ${ATTENDEE_RECORDING_SPOOL_HOST_PATH:-/var/lib/attendee/recordings}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-989}"
    command: celery -A attendee worker -n launcher@%h -l INFO -Q bot_launcher_vm -c 2 -I bots.tasks.joining_watchdog_task
    depends_on: [postgres, redis]

  attendee-webhook-worker:
    image: ${ATTENDEE_RELEASE_IMAGE:?Set ATTENDEE_RELEASE_IMAGE to an immutable Attendee image tag}
    restart: always
    network_mode: host
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: attendee.settings.production
      DELIVER_WEBHOOK_CELERY_QUEUE: "webhooks"
    command: celery -A attendee worker -n webhook@%h -l INFO -Q webhooks --concurrency=2
    depends_on: [postgres, redis]

  attendee-scheduler:
    image: ${ATTENDEE_RELEASE_IMAGE:?Set ATTENDEE_RELEASE_IMAGE to an immutable Attendee image tag}
    restart: always
    network_mode: host
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: attendee.settings.production
      DELIVER_WEBHOOK_CELERY_QUEUE: "webhooks"
      BOT_RECORDING_SPOOL_DIRECTORY: "/attendee-recording-spool"
    entrypoint: []
    command: python manage.py run_scheduler
    volumes:
      - ${ATTENDEE_RECORDING_SPOOL_HOST_PATH:-/var/lib/attendee/recordings}:/attendee-recording-spool
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-989}"
    depends_on: [postgres, redis]

  postgres:
    image: postgres:15.3-alpine
    restart: always
    network_mode: host
    env_file: .env.prod
    environment:
      PGDATA: /data/postgres
    # listen_addresses=127.0.0.1 garante que postgres não fica exposto externamente
    command: postgres -c listen_addresses=127.0.0.1
    volumes:
      - postgres_data:/data/postgres

  redis:
    image: redis:7-alpine
    restart: always
    network_mode: host
    # --bind 127.0.0.1 garante que redis não fica exposto externamente
    command: redis-server --save 60 1 --loglevel warning --bind 127.0.0.1
    volumes:
      - redis_data:/data/redis

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    network_mode: host
    command: server /data --console-address ":9001"
    env_file: .env.prod
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
